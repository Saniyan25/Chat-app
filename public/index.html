<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #dadbd4; }
        .chat-container { width: 100%; max-width: 900px; height: 95vh; background: #efeae2; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; }
        #app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
        #chat-panel { display: flex; flex-direction: column; height: 100%; width: 100%; }
        #video-panel { display: none; background: #141414; position: relative; height: 100%; width: 100%; flex-direction: column; }
        .header { background: #008069; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-weight: bold; justify-content: space-between; }
        .avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://githubusercontent.com'); }
        .msg { max-width: 65%; padding: 8px 14px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.received { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .msg.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
        .input-bar { background: #f0f2f5; padding: 10px 20px; display: flex; gap: 10px; align-items: center; }
        .input-bar input { flex-grow: 1; padding: 12px; border: none; border-radius: 8px; outline: none; font-size: 15px; }
        .input-bar button { background: #008069; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input-bar button:hover { background: #006e5a; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="app-wrapper">
            <!-- PANEL 1: TEXT CHAT -->
            <div id="chat-panel">
                <div class="header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="avatar">💬</div>
                        <div>Miya biwi time</div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="voice-call-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">📞 Voice Call</button>
                        <button id="call-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">📹 Video Call</button>
                        <button id="nudge-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">🔔 Call Friend</button>
                    </div>
                </div>
                <div class="messages-area" id="messages-area"></div>
                <div id="typing-indicator" style="padding: 5px 20px; font-size: 13px; color: #667781; font-style: italic; min-height: 25px;"></div>
                <form class="input-bar" id="chat-form">
                    <input id="message-input" autocomplete="off" placeholder="Type a message" required />
                    <button type="submit">Send</button>
                </form>
            </div>
            <!-- PANEL 2: LIVE CALL PANEL -->
            <div id="video-panel">
                <div style="background: rgba(0,0,0,0.4); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; z-index: 10;">
                    <div id="call-status-text">🟢 Connected</div>
                    <div style="display: flex; gap: 10px;">
                        <button id="toggle-cam-btn" style="background: #34b7f1; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;">📷 Camera On/Off</button>
                        <button id="hangup-btn" style="background: #ea4335; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;">❌ End Call</button>
                    </div>
                </div>
                <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <video id="local-video" autoplay playsinline muted style="position: absolute; bottom: 20px; right: 20px; width: 100px; height: 140px; object-fit: cover; border: 2px solid white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transform: scaleX(-1);"></video>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });

        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messagesArea = document.getElementById('messages-area');
        const typingIndicator = document.getElementById('typing-indicator');
        const nudgeBtn = document.getElementById('nudge-btn');

        const chatPanel = document.getElementById('chat-panel');
        const videoPanel = document.getElementById('video-panel');
        const voiceCallBtn = document.getElementById('voice-call-btn');
        const callBtn = document.getElementById('call-btn');
        const toggleCamBtn = document.getElementById('toggle-cam-btn');
        const hangupBtn = document.getElementById('hangup-btn');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const callStatusText = document.getElementById('call-status-text');

        let typingTimeout;
        let localStream;
        let peerConnection;
        
        let iAmPolite = false; 
        let makingOffer = false;
        let isRemoteDescriptionSet = false;
        let iceCandidateQueue = [];

        // --- FIX: Correct Google STUN Server URI ---
        const rtcConfig = { 
            iceServers: [{ urls: 'stun:://google.com' }] 
        };

        socket.on('assign-role', (data) => {
            iAmPolite = data.isPolite;
        });

        // --- CHAT SYSTEM LOGIC ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (msg) => {
            const item = document.createElement('div');
            item.classList.add('msg', 'received'); // default layout
            item.textContent = msg;
            messagesArea.appendChild(item);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        });

        // --- WEBRTC CORE FLOW ---
        function switchToVideoView(showVideo) {
            if (showVideo) {
                chatPanel.style.display = 'none';
                videoPanel.style.display = 'flex';
            } else {
                chatPanel.style.display = 'flex';
                videoPanel.style.display = 'none';
                makingOffer = false;
                isRemoteDescriptionSet = false;
                iceCandidateQueue = [];
                if (localStream) { 
                    localStream.getTracks().forEach(track => track.stop()); 
                    localStream = null;
                }
                if (peerConnection) { 
                    peerConnection.close(); 
                    peerConnection = null;
                }
            }
        }

        async function startCallFlow(wantVideo) {
            switchToVideoView(true);
            callStatusText.textContent = "Connecting...";

            try {
                // Fetch local camera & microphone streams
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: wantVideo, 
                    audio: true 
                });
                localVideo.srcObject = localStream;

                // Instantiate peer connection object
                peerConnection = new RTCPeerConnection(rtcConfig);

                // Attach media streams to network pipeline
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Send ICE Network routes to signaling server
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('webrtc-ice', event.candidate);
                    }
                };

                // Catch incoming media streams from partner
                peerConnection.ontrack = (event) => {
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        callStatusText.textContent = "🟢 Connected";
                    }
                };

                // Handle incoming negotiation criteria dynamically
                peerConnection.onnegotiationneeded = async () => {
                    try {
                        makingOffer = true;
                        await peerConnection.setLocalDescription();
                        socket.emit('webrtc-offer', peerConnection.localDescription);
                    } catch (err) {
                        console.error("Negotiation setup failed", err);
                    } finally {
                        makingOffer = false;
                    }
                };

            } catch (err) {
                console.error("Could not access media devices.", err);
                alert("Please check that microphone and camera access is granted in your browser settings.");
                switchToVideoView(false);
            }
        }

        // --- CALL SIGNAL RECEIVERS ---
        socket.on('webrtc-offer', async (offer) => {
            if (!peerConnection) {
                // If receiver didn't click call, start connection passively
                await startCallFlow(true); 
            }
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                isRemoteDescriptionSet = true;
                
                // Process pending items in connection queue
                while (iceCandidateQueue.length) {
                    await peerConnection.addIceCandidate(iceCandidateQueue.shift());
                }

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc-answer', peerConnection.localDescription);
            } catch (err) {
                console.error("Failed processing incoming call offer:", err);
            }
        });

        socket.on('webrtc-answer', async (answer) => {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                isRemoteDescriptionSet = true;
            } catch (err) {
                console.error("Failed processing answer:", err);
            }
        });

        socket.on('webrtc-ice', async (candidate) => {
            try {
                const iceCandidate = new RTCIceCandidate(candidate);
                if (isRemoteDescriptionSet && peerConnection) {
                    await peerConnection.addIceCandidate(iceCandidate);
                } else {
                    iceCandidateQueue.push(iceCandidate);
                }
            } catch (err) {
                console.error("Failed handling ICE transmission:", err);
            }
        });

        socket.on('end-call', () => {
            switchToVideoView(false);
        });

        // --- BUTTON EVENT LISTENERS ---
        callBtn.addEventListener('click', () => startCallFlow(true));
        voiceCallBtn.addEventListener('click', () => startCallFlow(false));
        
        hangupBtn.addEventListener('click', () => {
            socket.emit('end-call');
            switchToVideoView(false);
        });

        toggleCamBtn.addEventListener('click', () => {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    toggleCamBtn.textContent = videoTrack.enabled ? "📷 Camera On/Off" : "📷 Camera Off";
                }
            }
        });
    </script>
</body>
</html>
