<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #dadbd4; }
        
        .chat-container { width: 100%; max-width: 900px; height: 95vh; background: #efeae2; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; }
        #app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
        #chat-panel { display: flex; flex-direction: column; height: 100%; width: 100%; }
        #video-panel { display: none; background: #141414; position: relative; height: 100%; width: 100%; flex-direction: column; }
        
        /* Fixed Header position layers to unblock user mouse input clicks */
        .header { background: #008069; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-weight: bold; justify-content: space-between; position: relative; z-index: 100; }
        .avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #efeae2; }
        .msg { max-width: 65%; padding: 8px 14px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.received { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .msg.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
        
        .input-bar { background: #f0f2f5; padding: 10px 20px; display: flex; gap: 10px; align-items: center; }
        .input-bar input { flex-grow: 1; padding: 12px; border: none; border-radius: 8px; outline: none; font-size: 15px; }
        .input-bar button { background: #008069; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input-bar button:hover { background: #006e5a; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="app-wrapper">
            
            <!-- PANEL 1: MESSAGING LOG INTERFACE -->
            <div id="chat-panel">
                <div class="header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="avatar">💬</div>
                        <div>Miya biwi time</div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="voice-call-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">📞 Voice Call</button>
                        <button id="call-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">📹 Video Call</button>
                        <button id="nudge-btn" style="background: #128c7e; color: white; border: 1px solid #ffffff50; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">🔔 Call Friend</button>
                    </div>
                </div>
                <div class="messages-area" id="messages-area"></div>
                <div id="typing-indicator" style="padding: 5px 20px; font-size: 13px; color: #667781; font-style: italic; min-height: 25px;"></div>
                <form class="input-bar" id="chat-form">
                    <input id="message-input" autocomplete="off" placeholder="Type a message" required />
                    <button type="submit">Send</button>
                </form>
            </div>

            <!-- PANEL 2: WEB RTC VIEWER DASHBOARD -->
            <div id="video-panel">
                <div style="background: rgba(0,0,0,0.4); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; z-index: 101;">
                    <div id="call-status-text">🟢 Connected</div>
                    <div style="display: flex; gap: 10px;">
                        <button id="toggle-cam-btn" style="background: #34b7f1; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;">📷 Camera On/Off</button>
                        <button id="hangup-btn" style="background: #ea4335; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;">❌ End Call</button>
                    </div>
                </div>
                <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <video id="local-video" autoplay playsinline muted style="position: absolute; bottom: 20px; right: 20px; width: 100px; height: 140px; object-fit: cover; border: 2px solid white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transform: scaleX(-1);"></video>
            </div>

        </div>
    </div>

      <script src="/socket.io/socket.io.js"></script>
    <script>
                const socket = io({ transports: ['websocket'] });

        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messagesArea = document.getElementById('messages-area');
        const typingIndicator = document.getElementById('typing-indicator');
        const nudgeBtn = document.getElementById('nudge-btn');

        const chatPanel = document.getElementById('chat-panel');
        const videoPanel = document.getElementById('video-panel');
        const voiceCallBtn = document.getElementById('voice-call-btn');
        const callBtn = document.getElementById('call-btn');
        const toggleCamBtn = document.getElementById('toggle-cam-btn');
        const hangupBtn = document.getElementById('hangup-btn');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const callStatusText = document.getElementById('call-status-text');

        let typingTimeout;
        let localStream;
        let peerConnection;
        
        let iAmPolite = false; 
        let makingOffer = false;
        let isRemoteDescriptionSet = false;
        let iceCandidateQueue = [];

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        socket.on('assign-role', (data) => {
            iAmPolite = data.isPolite;
            console.log("Network position assigned. Am I polite?:", iAmPolite);
        });

        try {
            if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        } catch (e) {}

        function sendNotification(title, bodyText) {
            if (document.visibilityState === "visible") return;
            if (window.Notification && Notification.permission === "granted") {
                new Notification(title, { body: bodyText, icon: "https://flaticon.com" });
            }
        }

        function switchToVideoView(showVideo) {
            if (showVideo) {
                chatPanel.style.display = 'none';
                videoPanel.style.display = 'flex';
            } else {
                chatPanel.style.display = 'flex';
                videoPanel.style.display = 'none';
                makingOffer = false;
                isRemoteDescriptionSet = false;
                iceCandidateQueue = [];
                if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
                if (peerConnection) { peerConnection.close(); }
            }
        }

        async function startCallFlow(wantVideo) {
            switchToVideoView(true);
            callStatusText.textContent = wantVideo ? "📹 Video Call Connecting..." : "📞 Voice Call Connecting...";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: wantVideo, audio: true });
                localVideo.srcObject = localStream;
                localVideo.style.display = wantVideo ? 'block' : 'none';
            } catch (err) {
                alert("Could not access media devices.");
                switchToVideoView(false);
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) { 
                    remoteVideo.srcObject = event.streams[0]; 
                    const hasVideo = event.streams[0].getVideoTracks().length > 0;
                    remoteVideo.style.display = hasVideo ? 'block' : 'none';
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice', { candidate: event.candidate, senderId: socket.id });
                }
            };

            try {
                makingOffer = true;
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-offer', { offer: offer, senderId: socket.id, videoMode: wantVideo });
            } catch (e) {
                console.error(e);
            } finally {
                makingOffer = false;
            }
        }

        callBtn.addEventListener('click', () => startCallFlow(true));
        voiceCallBtn.addEventListener('click', () => startCallFlow(false));

        toggleCamBtn.addEventListener('click', async () => {
            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length > 0) {
                videoTracks[0].enabled = !videoTracks[0].enabled;
                localVideo.style.display = videoTracks[0].enabled ? 'block' : 'none';
            }
        });

        hangupBtn.addEventListener('click', () => {
            switchToVideoView(false);
            socket.emit('end-call');
        });
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const messageData = { text: input.value, sender: socket.id };
                socket.emit('chat message', messageData);
                input.value = '';
                socket.emit('stop typing');
            }
        });

        input.addEventListener('keypress', () => {
            socket.emit('start typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('stop typing'); }, 2000);
        });

        nudgeBtn.addEventListener('click', () => {
            try { if (window.Notification && Notification.permission !== "granted") { Notification.requestPermission(); } } catch (e) {}
            socket.emit('send nudge');
            alert("Sent a notification nudge to the room!");
        });

        socket.on('chat message', (data) => {
            const msgElement = document.createElement('div');
            const isMe = data.sender === socket.id;
            msgElement.className = isMe ? 'msg sent' : 'msg received';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgElement.innerHTML = `${data.text}<div class="msg-meta">${time}</div>`;
            messagesArea.appendChild(msgElement);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            if (!isMe) sendNotification("New Message", data.text);
        });

        socket.on('user typing', () => { typingIndicator.textContent = "Someone is typing..."; });
        socket.on('user stop typing', () => { typingIndicator.textContent = ""; });
        socket.on('receive nudge', () => {
            sendNotification("Miya biwi time", "🚨 Wake up! Someone is waiting for you in the chatroom!");
            alert("🚨 Wake up! Someone is waiting for you in the chatroom!");
        });

        // --- FIXED COLLISION HANDLING INCOMING CALL ENGINE ---
        socket.on('webrtc-offer', async (data) => {
            if (data.senderId === socket.id) return; // Drop own echo data

            const collision = makingOffer || (peerConnection && peerConnection.signalingState !== "stable");
            
            if (collision) {
                if (!iAmPolite) {
                    console.log("Collision: Impolite peer ignored conflicting offer.");
                    return; 
                } else {
                    console.log("Collision: Polite peer backing down to accept incoming call.");
                    if (peerConnection) {
                        peerConnection.close();
                        peerConnection = null;
                    }
                }
            }

            const alertTitle = data.videoMode ? "📹 Incoming Video Call!" : "📞 Incoming Voice Call!";
            const acceptCall = confirm(`${alertTitle} Click OK to accept.`);
            if (!acceptCall) {
                socket.emit('end-call');
                return;
            }

            switchToVideoView(true);
            callStatusText.textContent = "🟢 Live Connected";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: data.videoMode, audio: true });
                localVideo.srcObject = localStream;
                localVideo.style.display = data.videoMode ? 'block' : 'none';
            } catch (err) {
                alert("Could not access media devices.");
                socket.emit('end-call');
                return;
            }

            if (!peerConnection) { peerConnection = new RTCPeerConnection(rtcConfig); }
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) { 
                    remoteVideo.srcObject = event.streams[0]; 
                    const hasVideo = event.streams[0].getVideoTracks().length > 0;
                    remoteVideo.style.display = hasVideo ? 'block' : 'none';
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice', { candidate: event.candidate, senderId: socket.id });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            isRemoteDescriptionSet = true;
            
            while (iceCandidateQueue.length > 0) {
                const cand = iceCandidateQueue.shift();
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(cand)); } catch(e) {}
            }

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('webrtc-answer', { answer: answer, senderId: socket.id });
        });

        socket.on('webrtc-answer', async (data) => {
            if (data.senderId === socket.id) return;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            callStatusText.textContent = "🟢 Live Connected";
        });

        socket.on('webrtc-ice', async (data) => {
            if (data.senderId === socket.id) return;
            if (!isRemoteDescriptionSet) {
                iceCandidateQueue.push(data.candidate);
            } else {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
            }
        });

        socket.on('end-call', () => {
            switchToVideoView(false);
            alert("The call has ended.");
        });
    
    </script>
</body>
</html>
